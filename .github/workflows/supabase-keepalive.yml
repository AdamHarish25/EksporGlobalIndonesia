# Menjaga project Supabase Free tetap bangun (anti-pause setelah 1 minggu idle).
# Cara aktifkan:
#   1. GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#      - SUPABASE_URL       (https://xxxxx.supabase.co)
#      - SUPABASE_ANON_KEY  (anon public key — BOLEH di sini, dilindungi RLS)
#   2. Actions → "Supabase Keep-Alive" → Enable workflow (atau push file ini).
# Catatan: ping ini read-only memakai anon key; tidak mengubah data apa pun.
# Jika upgrade ke Pro, workflow ini bisa dihapus (tambahkan ke .github/workflows/disabled/).

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 1 * * 1,4' # Senin & Kamis 08:00 WIB
  workflow_dispatch: # tombol manual di tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (products + site_content)
        run: |
          for table in products site_content; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "$table → HTTP $code"
            [ "$code" = "200" ] || exit 1
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
